<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="styleSheet.css">
</head>
<body>

  <div id="questionpanel">

    <!-- Pulse ring timer -->
    <div id="timer-container">
      <div id="timer-widget">
        <div id="pulse-ring"></div>
        <div id="pulse-core">
          <span id="timer-num">15</span>
        </div>
      </div>
    </div>

    <!-- question + options injected by JS here -->

    <div id="feedback-bar">
      <h5 id="checkradio_click"></h5>
      <h3 id="answerCorrect"></h3>
      <h4 id="showresultpanel"></h4>
    </div>

  </div>

  <script src="Appfront.js"></script>
</body>
</html>
