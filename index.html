<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="styleSheet.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="questionpanel">

    <!-- Circular countdown timer -->
    <div id="timer-container">
      <div id="timer-widget">
        <svg width="70" height="70" viewBox="0 0 70 70">
          <circle cx="35" cy="35" r="28"
            fill="none" stroke="rgba(127,255,212,0.12)" stroke-width="5"/>
          <circle id="timer-arc" cx="35" cy="35" r="28"
            fill="none" stroke="#1D9E75" stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="175.9"
            stroke-dashoffset="0"
            style="transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 0.9s linear, stroke 0.5s"/>
        </svg>
        <div id="timer-num">15</div>
      </div>
    </div>

    <!-- question + options injected by JS -->

    <div id="feedback-bar">
      <h5 id="checkradio_click"></h5>
      <h3 id="answerCorrect"></h3>
      <h4 id="showresultpanel"></h4>
    </div>

  </div>

  <script src="Appfront.js"></script>

  <script>
    /* ── Aurora background ── */
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, t  = 0;

    const blobs = [
      { x:.25, y:.40, rx:420, ry:180, hue:170, spd:.0007 },
      { x:.65, y:.55, rx:380, ry:160, hue:200, spd:.0011 },
      { x:.45, y:.25, rx:460, ry:140, hue:145, spd:.0009 },
      { x:.55, y:.70, rx:340, ry:130, hue:260, spd:.0013 },
    ];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function drawBlob(b, time) {
      const cx = b.x * W + Math.sin(time * b.spd * 1.3 * 1000) * W * 0.08;
      const cy = b.y * H + Math.cos(time * b.spd * 1000)        * H * 0.06;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(b.rx, b.ry));
      grad.addColorStop(0,   `hsla(${b.hue},80%,55%,0.28)`);
      grad.addColorStop(0.5, `hsla(${b.hue+20},70%,45%,0.12)`);
      grad.addColorStop(1,   `hsla(${b.hue+40},60%,35%,0)`);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(b.rx / Math.max(b.rx,b.ry), b.ry / Math.max(b.rx,b.ry));
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(0,0,Math.max(b.rx,b.ry),0,Math.PI*2); ctx.fill();
      ctx.restore();
    }

    function drawScanlines() {
      ctx.save();
      for (let y=0; y<H; y+=4) {
        ctx.fillStyle = 'rgba(0,0,0,0.04)';
        ctx.fillRect(0,y,W,1);
      }
      ctx.restore();
    }

    function animate(now) {
      t = now;
      ctx.clearRect(0,0,W,H);
      const base = ctx.createLinearGradient(0,0,0,H);
      base.addColorStop(0,'#03070f'); base.addColorStop(0.5,'#050d18'); base.addColorStop(1,'#020a10');
      ctx.fillStyle = base; ctx.fillRect(0,0,W,H);

      if (!animate._stars) {
        animate._stars = Array.from({length:160}, () => ({
          x:Math.random(), y:Math.random(),
          r:Math.random()*1.2+0.2,
          a:Math.random()*0.7+0.2,
          tw:Math.random()*Math.PI*2
        }));
      }
      animate._stars.forEach(s => {
        s.tw += 0.008;
        const alpha = s.a * (0.6 + 0.4*Math.sin(s.tw));
        ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(200,230,255,${alpha})`; ctx.fill();
      });

      blobs.forEach(b => drawBlob(b, t));
      drawScanlines();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(animate);
  </script>

</body>
</html>
