<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Game</title>
  <link rel="stylesheet" href="styleSheet.css">
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <div id="questionpanel">
    <div id="feedback-bar">
      <h5 id="checkradio_click"></h5>
      <h3 id="answerCorrect"></h3>
      <h4 id="showresultpanel"></h4>
    </div>
  </div>

  <script src="Appfront.js"></script>

  <!-- 🌿 MINT GEOMETRIC PULSE BACKGROUND -->
  <script>
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let w, h, t = 0;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function drawHex(x, y, size, rot, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);

      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 3) * i;
        const px = size * Math.cos(angle);
        const py = size * Math.sin(angle);
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();

      ctx.strokeStyle = `rgba(120, 255, 200, ${alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    function animate() {
      t += 0.003;

      ctx.clearRect(0, 0, w, h);

      /* soft mint gradient background */
      const bg = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, Math.max(w, h));
      bg.addColorStop(0, "#06110f");
      bg.addColorStop(1, "#020806");

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      const spacing = 130;

      for (let x = 0; x < w + spacing; x += spacing) {
        for (let y = 0; y < h + spacing; y += spacing) {

          const dx = w/2 - x;
          const dy = h/2 - y;
          const dist = Math.sqrt(dx*dx + dy*dy);

          const pulse = Math.sin(t * 3 - dist * 0.01);

          const size = 16 + pulse * 5;
          const alpha = 0.12 + pulse * 0.08;
          const rot = t + dist * 0.002;

          drawHex(x, y, size, rot, alpha);
        }
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    resize();
    animate();
  </script>

</body>
</html>
