<script>
  const canvas = document.getElementById("bg-canvas");
  const ctx = canvas.getContext("2d");

  let width, height;
  const fontSize = 16;
  let columns;
  let drops = [];

  const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    columns = Math.floor(width / fontSize);
    drops = Array(columns).fill(0);
  }

  function draw() {
    /* cleaner trailing fade */
    ctx.fillStyle = "rgba(3, 7, 15, 0.12)";
    ctx.fillRect(0, 0, width, height);

    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {

      const text = chars[Math.floor(Math.random() * chars.length)];

      /* brighter leading feel */
      ctx.fillStyle = "rgba(0,255,159,0.75)";
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      /* smoother consistent movement */
      drops[i] += Math.random() > 0.5 ? 1 : 0;

      /* reset when off screen */
      if (drops[i] * fontSize > height && Math.random() > 0.97) {
        drops[i] = 0;
      }
    }
  }

  window.addEventListener("resize", resize);
  resize();

  /* smoother animation loop instead of setInterval */
  function animate() {
    draw();
    requestAnimationFrame(animate);
  }

  animate();
</script>
